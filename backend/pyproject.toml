[project]
name = "resumeai-backend"
version = "0.1.0"
description = "ResumeAI - AI resume analyzer and job matching SaaS (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.6.*",
    "email-validator==2.2.*",
    "sqlalchemy==2.0.*",
    "alembic==1.14.*",
    "argon2-cffi==23.1.*",
    "pdfplumber==0.11.*",
    "python-docx==1.1.*",
    "python-multipart==0.0.*",
    "jinja2==3.1.*",
    "weasyprint==70.*",
    "google-generativeai==0.8.*",
    "psycopg[binary]==3.2.*",
    "httpx==0.27.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.*",
    "ruff==0.7.*",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated migration files are immutable history once applied — reviewed at
# generation time, never lint-fixed afterward. alembic/env.py stays linted.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["I001", "F401"]
