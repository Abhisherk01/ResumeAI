name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resumeai
          POSTGRES_PASSWORD: resumeai
          POSTGRES_DB: resumeai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resumeai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://resumeai:resumeai@localhost:5432/resumeai_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install ".[dev]"

      # First automated proof of the migration chain, from base to head,
      # against real Postgres (Phase 11, D28).
      - name: Migration chain (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://resumeai:resumeai@localhost:5432/resumeai_test
        run: alembic upgrade head

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Pytest (against Postgres)
        working-directory: backend
        run: pytest -q
