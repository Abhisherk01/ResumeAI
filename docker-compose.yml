services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resumeai
      POSTGRES_PASSWORD: resumeai
      POSTGRES_DB: resumeai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resumeai -d resumeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Inside Docker, the database host is the service name "db", not localhost
      DATABASE_URL: postgresql+psycopg://resumeai:resumeai@db:5432/resumeai
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # live code editing + --reload
    depends_on:
      db:
        condition: service_healthy   # backend waits until Postgres accepts connections

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      WATCHPACK_POLLING: "true"    # reliable file-watching inside the container
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # keeps container's node_modules isolated
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules: